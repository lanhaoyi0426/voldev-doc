<h2>关于本教程</h2>
<p>作者：创世魂</p>
<p>概述：本篇教程主要以火山视窗为视角、少量易语言视角，来介绍火山视窗软件开发平台基本语法和基本操作，从而能够快速的从易语言软件开发转换到火山视窗软件开发。</p>
<p>在阅读本教程之前，强烈建议首先观看一下<a href="../vol/index.html" target="_blank">《火山新手入门教程》</a>，以便于快速理解本教程内容。</p>
