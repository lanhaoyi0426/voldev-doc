<h2>关于本教程</h2>
<p>作者：创世魂</p>
<p>概述：本篇教程主要介绍火山视窗中各个组件如何使用，从而快速掌握视窗平台中的组件操作，实现windows程序开发。</p>
<p>在阅读本教程之前，强烈建议首先观看一下<a href="../vol/index.html" target="_blank">《火山新手入门教程》</a>。</p>
<p>如果您曾经学习过易语言，强烈建议观看一下<a href="../e_To_vol/index.html" target="_blank">《易语言到火山视窗入门教程》</a>，以便于快速理解本教程内容。</p>
